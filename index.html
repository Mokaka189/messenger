<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Audio Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Подключаем внешний CSS файл -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <i class="fa-brands fa-telegram fa-4x" style="color:var(--blue); margin-bottom:15px;"></i>
        <h2>Cloud Audio</h2>
        <input type="text" id="a-login" placeholder="Логин">
        <input type="password" id="a-pass" placeholder="Пароль">
        <button class="btn btn-blue" id="auth-login-btn">ВОЙТИ</button>
        <button class="btn" style="background:none; color:var(--gray)" id="auth-reg-btn">Регистрация</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="tabs">
        <div class="tab active" id="tab-ch">КАНАЛЫ</div>
        <div class="tab" id="tab-dm">ЛИЧНЫЕ</div>
    </div>
    <div class="sidebar-header">
        <input type="text" id="search-input" placeholder="Введите ID...">
        <button class="btn btn-blue" id="action-btn">Создать канал</button>
    </div>
    <div class="rooms-list" id="rooms-list"></div>
    <div style="padding:15px; border-top:1px solid #0e1621; display:flex; align-items:center; gap:10px; cursor:pointer;" id="open-profile-btn">
        <div class="av" id="my-av">?</div>
        <div style="flex:1"><b id="my-name">...</b><div style="font-size:10px; color:var(--gray)">Настройки</div></div>
    </div>
</div>

<div class="chat-area">
    <div class="chat-header">
        <button class="icon-btn" id="menu-toggle-btn">
            <i class="fa fa-bars"></i>
        </button>
        <b id="h-name">Выберите чат</b>
        <button class="icon-btn" id="call-init-btn" style="margin-left:auto; display:none; color:var(--success)">
            <i class="fa fa-phone"></i>
        </button>
    </div>
    <div id="messages"></div>
    <div class="input-bar">
        <button class="icon-btn" id="attach-file-btn"><i class="fa fa-paperclip"></i></button> <!-- Кнопка для вложений -->
        <input type="file" id="file-input" style="display: none;" accept="image/*,audio/*,video/*"> <!-- Скрытый инпут для файлов -->
        <button class="icon-btn" id="voice-record-btn"><i class="fa fa-microphone"></i></button>
        <input type="text" id="msg-input" placeholder="Сообщение..." disabled>
        <button class="icon-btn" style="color:var(--blue)" id="send-msg-btn"><i class="fa fa-paper-plane"></i></button>
    </div>
</div>

<div class="modal" id="call-modal">
    <div class="modal-box">
        <i class="fa fa-phone-volume fa-3x call-anim"></i>
        <h3 id="call-title">Звонок...</h3>
        <p id="call-user">Имя</p>
        <div style="display:flex; gap:10px; margin-top:20px; justify-content: center;">
            <button class="btn" id="answer-btn" style="background:var(--success); color:white; display:none;">Принять</button>
            <button class="btn" id="hangup-btn" style="background:var(--danger); color:white;">Сброс</button>
        </div>
        <audio id="remote-audio" autoplay></audio>
        <button class="icon-btn" id="mute-toggle-btn" style="color: white; margin-top: 20px;">
            <i class="fa fa-microphone-slash"></i>
        </button>
    </div>
</div>

<div class="modal" id="modal-p">
    <div class="modal-box">
        <h3>Ваш ID</h3>
        <p id="p-uid" style="background:#0e1621; padding:10px; border-radius:10px; font-family:monospace; word-break: break-all;"></p>
        <button class="btn btn-blue" id="copy-uid-btn">Копировать ID</button>
        <button class="btn" style="background:var(--danger); color:white; margin-top:10px;" id="logout-btn">ВЫЙТИ</button>
        <button class="btn" style="background:none; color:white; margin-top:5px" id="close-profile-modal-btn">Назад</button>
    </div>
</div>

<script type="module">
    // Импорты Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

    // Инициализация Firebase
    const firebaseConfig = { databaseURL: "https://maxi-b3761-default-rtdb.firebaseio.com" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // Все ваши переменные и функции
    let user = null, activeId = null, currentTab = 'ch';
    let pc, localStream;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let isMuted = false;
    let currentIncomingCallListenerFn = null; // Для очистки слушателя входящих звонков

    const genID = (pre) => pre + '_' + Math.random().toString(36).substr(2, 9);
    const getEl = (id) => document.getElementById(id);

    // --- Функции (Auth, Sidebar, Call, etc.) ---
    async function auth(type) {
        const l = getEl('a-login').value.trim();
        const p = getEl('a-pass').value.trim();
        if(!l || !p) {
            alert("Пожалуйста, введите логин и пароль.");
            return;
        }

        try {
            if(type === 'reg') {
                const existingUser = await get(ref(db, 'users/' + l));
                if (existingUser.exists()) {
                    alert("Пользователь с таким логином уже существует.");
                    return;
                }
                const uid = genID('u');
                await set(ref(db, 'users/' + l), { pass: p, uid: uid });
                alert("Регистрация успешна! Теперь вы можете войти.");
                const aPass = getEl('a-pass');
                if (aPass) aPass.value = '';
            } else {
                const snapshot = await get(ref(db, 'users/' + l));
                if(snapshot.exists() && snapshot.val().pass === p) {
                    user = { login: l, ...snapshot.val() };
                    if(!user.uid) {
                        user.uid = genID('u');
                        await update(ref(db, 'users/'+l), {uid: user.uid});
                    }
                    localStorage.setItem('cloud_v10', JSON.stringify({l, p}));
                    const authScreen = getEl('auth-screen');
                    if (authScreen) authScreen.style.display = 'none';
                    startApp();
                } else {
                    alert("Неверный логин или пароль.");
                    const aPass = getEl('a-pass');
                    if (aPass) aPass.value = '';
                }
            }
        } catch (error) {
            console.error("Ошибка аутентификации:", error);
            alert("Произошла ошибка при попытке " + (type === 'reg' ? "регистрации" : "входа") + ". Проверьте консоль для деталей.");
        }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function startApp() {
        const myName = getEl('my-name');
        if (myName) myName.innerText = user.login;

        const myAv = getEl('my-av');
        if (myAv) myAv.innerText = user.login[0].toUpperCase();

        onValue(ref(db, `user_chats/${user.login}`), () => renderSidebar());
        listenForCalls();
        renderSidebar();
        const authScreen = getEl('auth-screen');
        if (authScreen) authScreen.style.display = 'none';
    }

    function setTab(t) {
        currentTab = t;
        const tabCh = getEl('tab-ch');
        if (tabCh) tabCh.classList.toggle('active', t === 'ch');

        const tabDm = getEl('tab-dm');
        if (tabDm) tabDm.classList.toggle('active', t === 'dm');

        const actionBtn = getEl('action-btn');
        if (actionBtn) actionBtn.innerText = t === 'ch' ? 'Создать канал' : 'Найти по ID';
        renderSidebar();
    }

    async function handleAction() {
        const searchInput = getEl('search-input');
        const val = searchInput ? searchInput.value.trim() : '';

        if(currentTab === 'ch') {
            const name = val || prompt("Введите название канала:");
            if(!name) return;
            const cid = genID('ch');
            await set(ref(db, 'rooms/' + cid), { name, owner: user.login });
            await update(ref(db, `user_chats/${user.login}`), { [cid]: true });
            alert(`Канал "${name}" создан! ID: ${cid}`);
        } else { // DM
            if (!val) {
                alert("Пожалуйста, введите ID пользователя.");
                return;
            }
            const usersRef = await get(ref(db, 'users'));
            let friendLogin = null;
            usersRef.forEach(u => {
                if(u.val().uid === val && u.key !== user.login) {
                    friendLogin = u.key;
                }
            });

            if(!friendLogin) {
                alert("Пользователь с таким ID не найден или это ваш ID.");
                return;
            }
            if (friendLogin === user.login) {
                 alert("Вы не можете добавить самого себя.");
                 return;
            }

            const dmid = [user.login, friendLogin].sort().join("___");
            await update(ref(db, `user_chats/${user.login}`), { [dmid]: true });
            await update(ref(db, `user_chats/${friendLogin}`), { [dmid]: true });
            alert(`Чат с пользователем ${friendLogin} добавлен.`);
        }
        if (searchInput) searchInput.value = '';
        renderSidebar();
    }

    function renderSidebar() {
        const box = getEl('rooms-list');
        if (!box) {
            console.warn("Элемент 'rooms-list' не найден.");
            return;
        }
        box.innerHTML = '';
        get(ref(db, `user_chats/${user.login}`)).then(snap => {
            const data = snap.val() || {};
            const chatIds = Object.keys(data).filter(id => {
                return (currentTab === 'ch' && id.startsWith('ch_')) || (currentTab === 'dm' && id.includes('___'));
            });

            chatIds.forEach(id => {
                if(id.startsWith('ch_')) {
                    get(ref(db, 'rooms/' + id)).then(s => {
                        if(s.exists()) createItem(id, s.val().name);
                    }).catch(e => console.error("Ошибка загрузки канала:", e));
                } else if(id.includes('___')) {
                    const otherUserLogin = id.replace(user.login, '').replace('___', '');
                    createItem(id, otherUserLogin);
                }
            });
        }).catch(e => console.error("Ошибка загрузки пользовательских чатов:", e));
    }

    function createItem(id, name) {
        const div = document.createElement('div');
        div.className = `item ${activeId === id ? 'active' : ''}`;
        div.setAttribute('data-chat-id', id);
        div.innerHTML = `<div class="av">${name[0].toUpperCase()}</div><b>${name}</b>`;
        div.addEventListener('click', () => selectChat(id, name));
        const roomsList = getEl('rooms-list');
        if (roomsList) roomsList.appendChild(div);
    }

    let unsubscribeMessages = null;

    function selectChat(id, name) {
        if (activeId === id) return;

        if (unsubscribeMessages) {
            unsubscribeMessages();
        }

        document.querySelectorAll('.rooms-list .item').forEach(item => {
            item.classList.remove('active');
        });
        const selectedItem = document.querySelector(`.rooms-list .item[data-chat-id="${id}"]`);
        if (selectedItem) {
            selectedItem.classList.add('active');
        }

        activeId = id;
        const hName = getEl('h-name');
        if (hName) hName.innerText = name;

        const msgInput = getEl('msg-input');
        if (msgInput) msgInput.disabled = false;
        
        const callInitBtn = getEl('call-init-btn');
        if (callInitBtn) {
            callInitBtn.style.display = id.includes('___') ? 'block' : 'none';
        }

        const chatPath = id.includes('___') ? `dms/${id}` : `messages/${id}`;
        const mBox = getEl('messages');
        if (!mBox) {
            console.warn("Элемент 'messages' не найден.");
            return;
        }
        mBox.innerHTML = '';

        unsubscribeMessages = onValue(ref(db, chatPath), snap => {
            mBox.innerHTML = '';
            snap.forEach(m => {
                const d = m.val();
                const div = document.createElement('div');
                div.className = `msg ${d.l === user.login ? 'sent' : ''} ${d.fileUrl ? 'with-file' : ''}`;
                
                let contentHTML = `<b>${d.l}: </b>`;

                if (d.fileUrl) {
                    if (d.fileType && d.fileType.startsWith('image/')) {
                        contentHTML += `<img src="${d.fileUrl}" alt="Изображение" loading="lazy">`;
                    } else if (d.fileType && d.fileType.startsWith('audio/')) {
                        contentHTML += `<audio controls src="${d.fileUrl}"></audio>`;
                    } else if (d.fileType && d.fileType.startsWith('video/')) {
                        contentHTML += `<video controls src="${d.fileUrl}"></video>`;
                    } else {
                        contentHTML += `<a href="${d.fileUrl}" target="_blank" rel="noopener noreferrer">${d.fileName || 'Файл'} <i class="fa fa-download"></i></a>`;
                    }
                }
                if (d.t) {
                    contentHTML += `<span>${d.t}</span>`;
                }
                if (d.status === 'uploading') {
                    contentHTML += `<div class="loading-indicator">Загрузка...</div>`;
                }

                div.innerHTML = contentHTML;
                mBox.appendChild(div);
            });
            mBox.scrollTop = mBox.scrollHeight;
        });

        if (window.innerWidth <= 768) {
            toggleSidebar();
        }
    }

    function compressImage(file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        return reject(new Error("Не удалось получить 2D контекст канваса."));
                    }
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error("Ошибка при создании Blob из канваса."));
                        }
                    }, file.type, quality);
                };
                img.onerror = () => reject(new Error("Ошибка загрузки изображения в Canvas."));
            };
            reader.onerror = () => reject(new Error("Ошибка чтения файла."));
            reader.readAsDataURL(file);
        });
    }

    async function sendMsg() {
        const msgInput = getEl('msg-input');
        const fileInput = getEl('file-input');
        const text = msgInput ? msgInput.value.trim() : '';
        const file = fileInput ? fileInput.files[0] : null;

        if ((!text && !file) || !activeId) return;

        if (msgInput) msgInput.value = '';
        
        const chatPath = activeId.includes('___') ? `dms/${activeId}` : `messages/${activeId}`;
        let fileUrl = null;
        let fileName = null;
        let fileType = null;

        if (file) {
            fileName = file.name;
            fileType = file.type;
            
            let fileToUpload = file;
            if (fileType.startsWith('image/')) {
                try {
                    fileToUpload = await compressImage(file, 800, 800, 0.8);
                } catch (error) {
                    console.error("Ошибка сжатия изображения:", error);
                    alert("Ошибка при сжатии изображения. Отправка оригинального.");
                    fileToUpload = file; // Отправляем оригинал, если сжатие не удалось
                }
            }

            const uniqueFileName = `${user.login}_${Date.now()}_${fileName}`;
            const fileStorageRef = storageRef(storage, `chat_files/${activeId}/${uniqueFileName}`);
            
            const tempMessageRef = push(ref(db, chatPath));
            await set(tempMessageRef, {
                l: user.login,
                t: text || '',
                fileName: fileName,
                fileType: fileType,
                status: 'uploading',
                timestamp: Date.now()
            });

            const uploadTask = uploadBytesResumable(fileStorageRef, fileToUpload);
            
            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    console.log('Upload is ' + progress + '% done');
                },
                (error) => {
                    console.error("Ошибка загрузки файла:", error);
                    update(tempMessageRef, { status: 'failed', errorMessage: error.message });
                    alert("Ошибка при загрузке файла.");
                },
                () => { // Успешная загрузка
                    getDownloadURL(uploadTask.snapshot.ref).then(async (downloadURL) => {
                        fileUrl = downloadURL;
                        await update(tempMessageRef, {
                            fileUrl: fileUrl,
                            status: 'sent',
                            timestamp: Date.now()
                        });
                        if (fileInput) fileInput.value = '';
                    });
                }
            );
        } else {
            push(ref(db, chatPath), { l: user.login, t: text, timestamp: Date.now() });
        }
    }

    function toggleSidebar() {
        const sidebar = getEl('sidebar');
        if (sidebar) sidebar.classList.toggle('active');
    }

    async function startCall() {
        if (!activeId || !activeId.includes('___')) {
            alert("Вы можете звонить только в личных чатах.");
            return;
        }

        const callModal = getEl('call-modal');
        const callTitle = getEl('call-title');
        const callUser = getEl('call-user');
        const hangupBtn = getEl('hangup-btn');
        const answerBtn = getEl('answer-btn');
        // muteToggleBtn привязан глобально
        const remoteAudio = getEl('remote-audio');


        if (callModal) callModal.style.display = 'flex';
        if (callTitle) callTitle.innerText = "Вызов...";
        if (callUser) callUser.innerText = activeId.replace(user.login,'').replace('___','');
        if (answerBtn) answerBtn.style.display = 'none';
        if (hangupBtn) hangupBtn.style.display = 'block';

        try {
            pc = new RTCPeerConnection(rtcConfig);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${activeId}/candi`), e.candidate.toJSON());
            pc.ontrack = e => { if (remoteAudio) remoteAudio.srcObject = e.streams[0]; };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, `calls/${activeId}/offer`), { sdp: offer.sdp, type: offer.type, from: user.login });

            onValue(ref(db, `calls/${activeId}/answer`), async s => {
                if(s.exists() && s.val().type === 'answer' && pc && pc.signalingState !== 'closed' && !pc.remoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
                    if (callTitle) callTitle.innerText = "Разговор...";
                }
            });
            onValue(ref(db, `calls/${activeId}/candi`), s => {
                s.forEach(c => {
                    const candidate = new RTCIceCandidate(c.val());
                    if (pc) pc.addIceCandidate(candidate).catch(e => console.warn("Error adding ICE candidate:", e));
                });
            });

            onValue(ref(db, `calls/${activeId}`), (snapshot) => {
                if (snapshot.val() === null && activeId) { // Если нода звонка удалена
                    stopCallAndReset();
                    alert("Звонок завершён другой стороной.");
                }
            }, { onlyOnce: false });

        } catch (error) {
            console.error("Ошибка при инициализации звонка:", error);
            alert("Не удалось начать звонок. Убедитесь, что у вас есть микрофон и вы дали разрешение.");
            stopCallAndReset();
        }
    }

    function listenForCalls() {
        if (currentIncomingCallListenerFn) {
            currentIncomingCallListenerFn(); // Отписываемся от старого
            currentIncomingCallListenerFn = null;
        }

        currentIncomingCallListenerFn = onValue(ref(db, `calls`), snap => {
            snap.forEach(call => {
                const data = call.val();
                if(call.key.includes(user.login) && data.offer && data.offer.from !== user.login &&
                   getEl('call-modal').style.display !== 'flex' && activeId !== call.key)
                {
                    showIncoming(call.key, data.offer);
                } else if (!data) { // Если кто-то из звонка удалил его у нас
                    if (activeId === call.key) {
                        stopCallAndReset();
                        alert("Звонок завершён (удален из БД).");
                    }
                }
            });
        }, { onlyOnce: false });
    }

    async function showIncoming(id, offer) {
        const callModal = getEl('call-modal');
        const callTitle = getEl('call-title');
        const callUser = getEl('call-user');
        const ansBtn = getEl('answer-btn');
        const hangupBtn = getEl('hangup-btn');
        const remoteAudio = getEl('remote-audio');
        
        if (callModal && callModal.style.display === 'flex' && activeId) {
            if (id !== activeId) { // Отклонить, если уже в звонке или обрабатываем другой
                await remove(ref(db, `calls/${id}`));
            }
            return;
        }

        if (callModal) callModal.style.display = 'flex';
        if (callTitle) callTitle.innerText = "Входящий вызов";
        if (callUser) callUser.innerText = offer.from;
        if (ansBtn) ansBtn.style.display = 'block';
        if (hangupBtn) hangupBtn.style.display = 'block';

        activeId = id;

        // Удалить старые обработчики, чтобы избежать дублирования
        const oldAnsClickHandler = ansBtn ? ansBtn._ansClickHandler : null;
        if (ansBtn && oldAnsClickHandler) {
            ansBtn.removeEventListener('click', oldAnsClickHandler);
        }

        async function ansClickHandler() {
            try {
                pc = new RTCPeerConnection(rtcConfig);
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

                pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${id}/candi`), e.candidate.toJSON());
                pc.ontrack = e => { if (remoteAudio) remoteAudio.srcObject = e.streams[0]; };
                
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                await set(ref(db, `calls/${id}/answer`), { sdp: ans.sdp, type: ans.type });
                
                onValue(ref(db, `calls/${id}/candi`), s => s.forEach(c => {
                    if (pc) pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(e => console.warn("Error adding ICE candidate:", e));
                }));
                
                if (ansBtn) ansBtn.style.display = 'none';
                if (callTitle) callTitle.innerText = "Разговор...";

                // Удаляем этот конкретный обработчик после его использования
                if (ansBtn) ansBtn.removeEventListener('click', ansClickHandler);

                onValue(ref(db, `calls/${id}`), (snapshot) => {
                    if (snapshot.val() === null && activeId) {
                        stopCallAndReset();
                        alert("Звонок завершён другой стороной.");
                    }
                }, { onlyOnce: false });

            } catch (error) {
                console.error("Ошибка при приёме звонка:", error);
                alert("Не удалось принять звонок. Убедитесь, что у вас есть микрофон.");
                stopCallAndReset();
            }
        }
        if (ansBtn) {
            ansBtn.addEventListener('click', ansClickHandler);
            ansBtn._ansClickHandler = ansClickHandler; // Сохраняем ссылку на обработчик для удаления
        }
    }

    // Глобальная функция для переключения mute
    function toggleMute() {
        if (localStream) {
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            const muteToggleBtn = getEl('mute-toggle-btn');
            if (muteToggleBtn) {
                 muteToggleBtn.classList.toggle('active', isMuted);
                 muteToggleBtn.querySelector('i').className = isMuted ? 'fa fa-microphone-slash' : 'fa fa-microphone';
            }
        }
    }

    function stopCallAndReset() {
        if(pc) {
            pc.close();
            pc = null;
        }
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        isMuted = false;
        const muteToggleBtn = getEl('mute-toggle-btn');
        if (muteToggleBtn) {
            muteToggleBtn.classList.remove('active');
            const icon = muteToggleBtn.querySelector('i');
            if (icon) icon.className = 'fa fa-microphone';
        }

        if (activeId) {
            // Исправлено: .catch() вызывается на результате remove(), который возвращает Promise
            remove(ref(db, `calls/${activeId}`))
                .catch(e => console.error("Ошибка удаления данных звонка:", e));
        }

        const callModal = getEl('call-modal');
        if (callModal) callModal.style.display = 'none';
        
        const remoteAudio = getEl('remote-audio');
        if (remoteAudio) remoteAudio.srcObject = null;
        
        activeId = null; 

        if (currentIncomingCallListenerFn) {
            currentIncomingCallListenerFn();
            currentIncomingCallListenerFn = null;
        }
    }

    function openProfile() {
        const modalP = getEl('modal-p');
        if (modalP) modalP.style.display='flex';
        const pUid = getEl('p-uid');
        if (pUid && user) pUid.innerText = user.uid;
    }
    function copyUID() { 
        if (user && user.uid) {
            navigator.clipboard.writeText(user.uid); 
            alert("ID Скопирован"); 
        } else {
            alert("Нет доступного ID для копирования.");
        }
    }
    function closeProfileModal() { 
        const modalP = getEl('modal-p');
        if (modalP) modalP.style.display='none'; 
    }


    // --- Привязка обработчиков событий после загрузки DOM и определения функций ---
    document.addEventListener('DOMContentLoaded', () => {
        // Кнопки аутентификации
        const authLoginBtn = getEl('auth-login-btn');
        if (authLoginBtn) authLoginBtn.addEventListener('click', () => auth('login'));

        const authRegBtn = getEl('auth-reg-btn');
        if (authRegBtn) authRegBtn.addEventListener('click', () => auth('reg'));

        // Кнопки сайдбара
        const tabCh = getEl('tab-ch');
        if (tabCh) tabCh.addEventListener('click', () => setTab('ch'));

        const tabDm = getEl('tab-dm');
        if (tabDm) tabDm.addEventListener('click', () => setTab('dm'));

        const actionBtn = getEl('action-btn');
        if (actionBtn) actionBtn.addEventListener('click', handleAction);

        const openProfileBtn = getEl('open-profile-btn');
        if (openProfileBtn) openProfileBtn.addEventListener('click', openProfile);

        // Кнопки чата
        const menuToggleBtn = getEl('menu-toggle-btn');
        if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);

        const callInitBtn = getEl('call-init-btn');
        if (callInitBtn) callInitBtn.addEventListener('click', startCall);

        const sendMsgBtn = getEl('send-msg-btn');
        if (sendMsgBtn) sendMsgBtn.addEventListener('click', sendMsg);

        const attachFileBtn = getEl('attach-file-btn');
        if (attachFileBtn) {
            attachFileBtn.addEventListener('click', () => {
                const fileInput = getEl('file-input');
                if (fileInput) fileInput.click();
            });
        }
        const fileInput = getEl('file-input');
        if (fileInput) fileInput.addEventListener('change', () => {
             console.log("Выбран файл:", fileInput.files[0]?.name);
             const msgInput = getEl('msg-input');
             if(msgInput) msgInput.focus();
        });


        // Кнопки модального окна звонка
        const hangupBtn = getEl('hangup-btn');
        if (hangupBtn) hangupBtn.addEventListener('click', stopCallAndReset);
        
        const muteToggleBtn = getEl('mute-toggle-btn');
        if (muteToggleBtn) muteToggleBtn.addEventListener('click', toggleMute);

        // Кнопки модального окна профиля
        const copyUidBtn = getEl('copy-uid-btn');
        if (copyUidBtn) copyUidBtn.addEventListener('click', copyUID);

        const logoutBtn = getEl('logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        const closeProfileModalBtn = getEl('close-profile-modal-btn');
        if (closeProfileModalBtn) closeProfileModalBtn.addEventListener('click', closeProfileModal);


        // Автоматический вход при наличии сохраненных данных
        const saved = localStorage.getItem('cloud_v10');
        if(saved) {
            const d = JSON.parse(saved);
            const aLogin = getEl('a-login');
            if (aLogin) aLogin.value=d.l;

            const aPass = getEl('a-pass');
            if (aPass) aPass.value=d.p;

            (async () => {
                 await auth('login');
            })();
        } else {
            const authScreen = getEl('auth-screen');
            if (authScreen) authScreen.style.display = 'flex';
        }
    });

</script>
</body>
</html>
