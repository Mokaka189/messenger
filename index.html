<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Audio Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Подключаем внешний CSS файл -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <i class="fa-brands fa-telegram fa-4x" style="color:var(--blue); margin-bottom:15px;"></i>
        <h2>Cloud Audio</h2>
        <input type="text" id="a-login" placeholder="Логин">
        <input type="password" id="a-pass" placeholder="Пароль">
        <button class="btn btn-blue" id="auth-login-btn">ВОЙТИ</button>
        <button class="btn" style="background:none; color:var(--gray)" id="auth-reg-btn">Регистрация</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="tabs">
        <div class="tab active" id="tab-ch">КАНАЛЫ</div>
        <div class="tab" id="tab-dm">ЛИЧНЫЕ</div>
    </div>
    <div class="sidebar-header">
        <input type="text" id="search-input" placeholder="Введите ID...">
        <button class="btn btn-blue" id="action-btn">Создать канал</button>
    </div>
    <div class="rooms-list" id="rooms-list"></div>
    <div style="padding:15px; border-top:1px solid #0e1621; display:flex; align-items:center; gap:10px; cursor:pointer;" id="open-profile-btn">
        <div class="av" id="my-av">?</div>
        <div style="flex:1"><b id="my-name">...</b><div style="font-size:10px; color:var(--gray)">Настройки</div></div>
    </div>
</div>

<div class="chat-area">
    <div class="chat-header">
        <button class="icon-btn" id="menu-toggle-btn">
            <i class="fa fa-bars"></i>
        </button>
        <b id="h-name">Выберите чат</b>
        <button class="icon-btn" id="call-init-btn" style="margin-left:auto; display:none; color:var(--success)">
            <i class="fa fa-phone"></i>
        </button>
    </div>
    <div id="messages"></div>
    <div class="input-bar">
        <button class="icon-btn" id="voice-record-btn"><i class="fa fa-microphone"></i></button>
        <input type="text" id="msg-input" placeholder="Сообщение..." disabled>
        <button class="icon-btn" style="color:var(--blue)" id="send-msg-btn"><i class="fa fa-paper-plane"></i></button>
    </div>
</div>

<div class="modal" id="call-modal">
    <div class="modal-box">
        <i class="fa fa-phone-volume fa-3x call-anim"></i>
        <h3 id="call-title">Звонок...</h3>
        <p id="call-user">Имя</p>
        <div style="display:flex; gap:10px; margin-top:20px; justify-content: center;">
            <button class="btn" id="answer-btn" style="background:var(--success); color:white; display:none;">Принять</button>
            <button class="btn" id="hangup-btn" style="background:var(--danger); color:white;">Сброс</button>
        </div>
        <audio id="remote-audio" autoplay></audio>
        <button class="icon-btn" id="mute-toggle-btn" style="color: white; margin-top: 20px;">
            <i class="fa fa-microphone-slash"></i>
        </button>
    </div>
</div>

<div class="modal" id="modal-p">
    <div class="modal-box">
        <h3>Ваш ID</h3>
        <p id="p-uid" style="background:#0e1621; padding:10px; border-radius:10px; font-family:monospace; word-break: break-all;"></p>
        <button class="btn btn-blue" id="copy-uid-btn">Копировать ID</button>
        <button class="btn" style="background:var(--danger); color:white; margin-top:10px;" id="logout-btn">ВЫЙТИ</button>
        <button class="btn" style="background:none; color:white; margin-top:5px" id="close-profile-modal-btn">Назад</button>
    </div>
</div>

<script type="module">
    // Импорты Firebase остаются здесь, в модуле
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // Инициализация Firebase
    const firebaseConfig = { databaseURL: "https://maxi-b3761-default-rtdb.firebaseio.com" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Все ваши переменные и функции
    let user = null, activeId = null, currentTab = 'ch';
    let pc, localStream;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let isMuted = false;

    const genID = (pre) => pre + '_' + Math.random().toString(36).substr(2, 9);
    const getEl = (id) => document.getElementById(id);

    // --- Функции (Auth, Sidebar, Call, etc.) ---
    async function auth(type) {
        const l = getEl('a-login').value.trim();
        const p = getEl('a-pass').value.trim();
        if(!l || !p) {
            alert("Пожалуйста, введите логин и пароль.");
            return;
        }

        try {
            if(type === 'reg') {
                const existingUser = await get(ref(db, 'users/' + l));
                if (existingUser.exists()) {
                    alert("Пользователь с таким логином уже существует.");
                    return;
                }
                const uid = genID('u');
                await set(ref(db, 'users/' + l), { pass: p, uid: uid });
                alert("Регистрация успешна! Теперь вы можете войти.");
                getEl('a-pass').value = '';
            } else {
                const snapshot = await get(ref(db, 'users/' + l));
                if(snapshot.exists() && snapshot.val().pass === p) {
                    user = { login: l, ...snapshot.val() };
                    if(!user.uid) {
                        user.uid = genID('u');
                        await update(ref(db, 'users/'+l), {uid: user.uid});
                    }
                    localStorage.setItem('cloud_v10', JSON.stringify({l, p}));
                    getEl('auth-screen').style.display = 'none';
                    startApp();
                } else {
                    alert("Неверный логин или пароль.");
                    getEl('a-pass').value = '';
                }
            }
        } catch (error) {
            console.error("Ошибка аутентификации:", error);
            alert("Произошла ошибка при попытке " + (type === 'reg' ? "регистрации" : "входа") + ". Проверьте консоль для деталей.");
        }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function startApp() {
        getEl('my-name').innerText = user.login;
        getEl('my-av').innerText = user.login[0].toUpperCase();
        onValue(ref(db, `user_chats/${user.login}`), () => renderSidebar());
        listenForCalls();
        renderSidebar();
        getEl('auth-screen').style.display = 'none';
    }

    function setTab(t) {
        currentTab = t;
        getEl('tab-ch').classList.toggle('active', t === 'ch');
        getEl('tab-dm').classList.toggle('active', t === 'dm');
        getEl('action-btn').innerText = t === 'ch' ? 'Создать канал' : 'Найти по ID';
        renderSidebar();
    }

    async function handleAction() {
        const val = getEl('search-input').value.trim();
        if(currentTab === 'ch') {
            const name = val || prompt("Введите название канала:");
            if(!name) return;
            const cid = genID('ch');
            await set(ref(db, 'rooms/' + cid), { name, owner: user.login });
            await update(ref(db, `user_chats/${user.login}`), { [cid]: true });
            alert(`Канал "${name}" создан! ID: ${cid}`);
        } else { // DM
            if (!val) {
                alert("Пожалуйста, введите ID пользователя.");
                return;
            }
            const usersRef = await get(ref(db, 'users'));
            let friendLogin = null;
            usersRef.forEach(u => {
                if(u.val().uid === val && u.key !== user.login) {
                    friendLogin = u.key;
                }
            });

            if(!friendLogin) {
                alert("Пользователь с таким ID не найден или это ваш ID.");
                return;
            }
            if (friendLogin === user.login) {
                 alert("Вы не можете добавить самого себя.");
                 return;
            }

            const dmid = [user.login, friendLogin].sort().join("___");
            await update(ref(db, `user_chats/${user.login}`), { [dmid]: true });
            await update(ref(db, `user_chats/${friendLogin}`), { [dmid]: true });
            alert(`Чат с пользователем ${friendLogin} добавлен.`);
        }
        getEl('search-input').value = '';
        renderSidebar();
    }

    function renderSidebar() {
        const box = getEl('rooms-list');
        box.innerHTML = '';
        get(ref(db, `user_chats/${user.login}`)).then(snap => {
            const data = snap.val() || {};
            const chatIds = Object.keys(data).filter(id => {
                return (currentTab === 'ch' && id.startsWith('ch_')) || (currentTab === 'dm' && id.includes('___'));
            });

            chatIds.forEach(id => {
                if(id.startsWith('ch_')) {
                    getref(db, 'rooms/' + id).then(s => {
                        if(s.exists()) createItem(id, s.val().name);
                    }).catch(e => console.error("Ошибка загрузки канала:", e));
                } else if(id.includes('___')) {
                    const otherUserLogin = id.replace(user.login, '').replace('___', '');
                    createItem(id, otherUserLogin);
                }
            });
        }).catch(e => console.error("Ошибка загрузки пользовательских чатов:", e));
    }

    function createItem(id, name) {
        const div = document.createElement('div');
        div.className = `item ${activeId === id ? 'active' : ''}`;
        div.setAttribute('data-chat-id', id);
        div.innerHTML = `<div class="av">${name[0].toUpperCase()}</div><b>${name}</b>`;
        div.addEventListener('click', () => selectChat(id, name));
        getEl('rooms-list').appendChild(div);
    }

    let unsubscribeMessages = null;

    function selectChat(id, name) {
        if (activeId === id) return;

        if (unsubscribeMessages) {
            unsubscribeMessages();
        }

        document.querySelectorAll('.rooms-list .item').forEach(item => {
            item.classList.remove('active');
        });
        const selectedItem = document.querySelector(`.rooms-list .item[data-chat-id="${id}"]`);
        if (selectedItem) {
            selectedItem.classList.add('active');
        }

        activeId = id;
        getEl('h-name').innerText = name;
        getEl('msg-input').disabled = false;
        
        const callInitBtn = getEl('call-init-btn');
        if (callInitBtn) {
            callInitBtn.style.display = id.includes('___') ? 'block' : 'none';
        }

        const chatPath = id.includes('___') ? `dms/${id}` : `messages/${id}`;
        const mBox = getEl('messages');
        mBox.innerHTML = '';

        unsubscribeMessages = onValue(ref(db, chatPath), snap => {
            mBox.innerHTML = '';
            snap.forEach(m => {
                const d = m.val();
                const div = document.createElement('div');
                div.className = `msg ${d.l === user.login ? 'sent' : ''}`;
                div.innerHTML = `<b>${d.l}: </b><span>${d.t}</span>`;
                mBox.appendChild(div);
            });
            mBox.scrollTop = mBox.scrollHeight;
        });

        if (window.innerWidth <= 768) {
            toggleSidebar();
        }
    }

    function sendMsg() {
        const msgInput = getEl('msg-input');
        const t = msgInput.value.trim();
        if(!t || !activeId) return;
        
        const chatPath = activeId.includes('___') ? `dms/${activeId}` : `messages/${activeId}`;
        push(ref(db, chatPath), { l: user.login, t: t });
        msgInput.value = '';
    }

    function toggleSidebar() {
        const sidebar = getEl('sidebar');
        sidebar.classList.toggle('active');
    }

    async function startCall() {
        if (!activeId || !activeId.includes('___')) {
            alert("Вы можете звонить только в личных чатах.");
            return;
        }

        const callModal = getEl('call-modal');
        const callTitle = getEl('call-title');
        const callUser = getEl('call-user');
        const hangupBtn = getEl('hangup-btn');
        const answerBtn = getEl('answer-btn');
        const muteToggleBtn = getEl('mute-toggle-btn');

        callModal.style.display = 'flex';
        callTitle.innerText = "Вызов...";
        callUser.innerText = activeId.replace(user.login,'').replace('___','');
        answerBtn.style.display = 'none';
        hangupBtn.style.display = 'block';

        try {
            pc = new RTCPeerConnection(rtcConfig);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${activeId}/candi`), e.candidate.toJSON());
            pc.ontrack = e => getEl('remote-audio').srcObject = e.streams[0];

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, `calls/${activeId}/offer`), { sdp: offer.sdp, type: offer.type, from: user.login });

            onValue(ref(db, `calls/${activeId}/answer`), async s => {
                if(s.exists() && s.val().type === 'answer' && pc.signalingState !== 'closed' && !pc.remoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
                    callTitle.innerText = "Разговор...";
                }
            });
            onValue(ref(db, `calls/${activeId}/candi`), s => {
                s.forEach(c => {
                    const candidate = new RTCIceCandidate(c.val());
                    pc.addIceCandidate(candidate).catch(e => console.warn("Error adding ICE candidate:", e));
                });
            });

            onValue(ref(db, `calls/${activeId}`), (snapshot) => {
                if (!snapshot.exists()) {
                    stopCallAndReset();
                    alert("Звонок завершён другой стороной.");
                }
            }, { onlyOnce: false });

        } catch (error) {
            console.error("Ошибка при инициализации звонка:", error);
            alert("Не удалось начать звонок. Убедитесь, что у вас есть микрофон и вы дали разрешение.");
            stopCallAndReset();
        }

        muteToggleBtn.onclick = () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                muteToggleBtn.classList.toggle('active', isMuted);
                muteToggleBtn.querySelector('i').className = isMuted ? 'fa fa-microphone-alt-slash' : 'fa fa-microphone';
            }
        };
    }

    function listenForCalls() {
        onValue(ref(db, `calls`), snap => {
            snap.forEach(call => {
                const data = call.val();
                if(call.key.includes(user.login) && data.offer && data.offer.from !== user.login) {
                    if (activeId !== call.key && getEl('call-modal').style.display !== 'flex') {
                           showIncoming(call.key, data.offer);
                    }
                }
            });
        }, { onlyOnce: false });
    }

    async function showIncoming(id, offer) {
        const callModal = getEl('call-modal');
        const callTitle = getEl('call-title');
        const callUser = getEl('call-user');
        const ansBtn = getEl('answer-btn');
        const hangupBtn = getEl('hangup-btn');
        const muteToggleBtn = getEl('mute-toggle-btn');
        
        if (callModal.style.display === 'flex' && activeId) {
            await remove(ref(db, `calls/${id}`));
            return;
        }

        callModal.style.display = 'flex';
        callTitle.innerText = "Входящий вызов";
        callUser.innerText = offer.from;
        ansBtn.style.display = 'block';
        hangupBtn.style.display = 'block';

        activeId = id;

        ansBtn.addEventListener('click', async function ansClickHandler() { // Именованная функция для возможности удаления обработчика
            try {
                pc = new RTCPeerConnection(rtcConfig);
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

                pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${id}/candi`), e.candidate.toJSON());
                pc.ontrack = e => getEl('remote-audio').srcObject = e.streams[0];
                
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                await set(ref(db, `calls/${id}/answer`), { sdp: ans.sdp, type: ans.type });
                
                onValue(ref(db, `calls/${id}/candi`), s => s.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(e => console.warn("Error adding ICE candidate:", e))));
                
                ansBtn.style.display = 'none';
                callTitle.innerText = "Разговор...";

                ansBtn.removeEventListener('click', ansClickHandler); // Удаляем обработчик после использования

                onValue(ref(db, `calls/${id}`), (snapshot) => {
                    if (!snapshot.exists()) {
                        stopCallAndReset();
                        alert("Звонок завершён другой стороной.");
                    }
                }, { onlyOnce: false });

            } catch (error) {
                console.error("Ошибка при приёме звонка:", error);
                alert("Не удалось принять звонок. Убедитесь, что у вас есть микрофон.");
                stopCallAndReset();
            }
        });

        muteToggleBtn.onclick = () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                muteToggleBtn.classList.toggle('active', isMuted);
                muteToggleBtn.querySelector('i').className = isMuted ? 'fa fa-microphone-alt-slash' : 'fa fa-microphone';
            }
        };
    }

    function stopCallAndReset() {
        if(pc) {
            pc.close();
            pc = null;
        }
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        isMuted = false;
        const muteToggleBtn = getEl('mute-toggle-btn');
        if (muteToggleBtn) {
            muteToggleBtn.classList.remove('active');
            muteToggleBtn.querySelector('i').className = 'fa fa-microphone';
        }

        if(activeId && getEl('call-modal').style.display === 'flex') {
            remove(ref(db, `calls/${activeId}`)).catch(e => console.error("Ошибка удаления данных звонка:", e));
        }

        getEl('call-modal').style.display = 'none';
        getEl('remote-audio').srcObject = null;
        activeId = null;
    }

    function openProfile() {
        getEl('modal-p').style.display='flex';
        getEl('p-uid').innerText = user.uid;
    }
    function copyUID() { navigator.clipboard.writeText(user.uid); alert("ID Скопирован"); }
    function closeProfileModal() { getEl('modal-p').style.display='none'; }


    // --- Привязка обработчиков событий после загрузки DOM и определения функций ---
    document.addEventListener('DOMContentLoaded', () => {
        // Кнопки аутентификации
        const authLoginBtn = getEl('auth-login-btn');
        if (authLoginBtn) authLoginBtn.addEventListener('click', () => auth('login'));

        const authRegBtn = getEl('auth-reg-btn');
        if (authRegBtn) authRegBtn.addEventListener('click', () => auth('reg'));

        // Кнопки сайдбара
        const tabCh = getEl('tab-ch');
        if (tabCh) tabCh.addEventListener('click', () => setTab('ch'));

        const tabDm = getEl('tab-dm');
        if (tabDm) tabDm.addEventListener('click', () => setTab('dm'));

        const actionBtn = getEl('action-btn');
        if (actionBtn) actionBtn.addEventListener('click', handleAction);

        const openProfileBtn = getEl('open-profile-btn');
        if (openProfileBtn) openProfileBtn.addEventListener('click', openProfile);

        // Кнопки чата
        const menuToggleBtn = getEl('menu-toggle-btn');
        if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);

        const callInitBtn = getEl('call-init-btn');
        if (callInitBtn) callInitBtn.addEventListener('click', startCall);

        const sendMsgBtn = getEl('send-msg-btn');
        if (sendMsgBtn) sendMsgBtn.addEventListener('click', sendMsg);

        // Кнопки модального окна звонка
        const hangupBtn = getEl('hangup-btn');
        if (hangupBtn) hangupBtn.addEventListener('click', stopCallAndReset);
        // Примечание: answer-btn привязывается внутри showIncoming, mute-toggle-btn.onclick внутри startCall и showIncoming

        // Кнопки модального окна профиля
        const copyUidBtn = getEl('copy-uid-btn');
        if (copyUidBtn) copyUidBtn.addEventListener('click', copyUID);

        const logoutBtn = getEl('logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        const closeProfileModalBtn = getEl('close-profile-modal-btn');
        if (closeProfileModalBtn) closeProfileModalBtn.addEventListener('click', closeProfileModal);


        // Автоматический вход при наличии сохраненных данных
        const saved = localStorage.getItem('cloud_v10');
        if(saved) {
            const d = JSON.parse(saved);
            const aLogin = getEl('a-login');
            if (aLogin) aLogin.value=d.l;

            const aPass = getEl('a-pass');
            if (aPass) aPass.value=d.p;

            (async () => {
                 await auth('login');
            })();
        } else {
            const authScreen = getEl('auth-screen');
            if (authScreen) authScreen.style.display = 'flex';
        }
    });

</script>
</body>
</html>
