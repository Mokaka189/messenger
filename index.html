<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Ultra FIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0e1621; --side: #17212b; --blue: #0088cc; --text: #fff; --gray: #708499; --sent: #2b5278; --danger: #e74c3c; --success: #2ecc71; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        .app-container { display: flex; width: 200vw; height: 100vh; transition: 0.3s; }
        .app-container.chat-open { transform: translateX(-100vw); }
        .sidebar, .chat-area { width: 100vw; height: 100vh; display: flex; flex-direction: column; }

        /* Auth */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--side); padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #242f3d; background: #0e1621; color: white; }

        /* Sidebar */
        .sidebar { background: var(--side); border-right: 1px solid #000; }
        .tabs { display: flex; background: #1c2733; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: var(--gray); font-weight: bold; }
        .tab.active { color: var(--blue); border-bottom: 2px solid var(--blue); }
        .list { flex: 1; overflow-y: auto; }
        .item { padding: 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1c2733; cursor: pointer; }
        .av { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }

        /* Chat */
        .chat-header { height: 60px; padding: 0 15px; background: var(--side); display: flex; align-items: center; border-bottom: 1px solid #000; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; background: #182533; position: relative; }
        .msg.sent { align-self: flex-end; background: var(--sent); }
        .status { font-size: 10px; margin-left: 5px; color: var(--gray); }
        .status.read { color: var(--success); }

        .input-bar { padding: 10px; background: var(--side); display: flex; align-items: center; gap: 8px; }
        .input-bar input { flex: 1; background: #0e1621; border: none; padding: 10px 15px; border-radius: 20px; color: white; }
        .btn-icon { background: none; border: none; color: var(--gray); font-size: 20px; cursor: pointer; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 20000; align-items: center; justify-content: center; }
        .m-box { background: var(--side); width: 85%; max-width: 300px; padding: 25px; border-radius: 20px; text-align: center; }
        .btn { border: none; padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<audio id="snd-msg" src="https://raw.githubusercontent.com/fshost/tg-sounds/master/sent.mp3"></audio>
<audio id="snd-ring" src="https://raw.githubusercontent.com/fshost/tg-sounds/master/incoming.mp3" loop></audio>
<audio id="snd-out" src="https://raw.githubusercontent.com/fshost/tg-sounds/master/outgoing.mp3" loop></audio>

<div id="auth-screen">
    <div class="auth-card">
        <h2>Cloud Ultra</h2>
        <input type="text" id="a-l" placeholder="Логин">
        <input type="password" id="a-p" placeholder="Пароль">
        <button class="btn" style="background:var(--blue); color:white" onclick="auth('login')">ВОЙТИ</button>
        <button class="btn" style="background:none; color:var(--gray)" onclick="auth('reg')">Регистрация</button>
    </div>
</div>

<div class="app-container" id="app">
    <div class="sidebar">
        <div class="tabs">
            <div class="tab active" onclick="setTab('ch', this)">КАНАЛЫ</div>
            <div class="tab" onclick="setTab('dm', this)">ЛИЧНЫЕ</div>
        </div>
        <div style="padding:10px">
            <input type="text" id="srch" placeholder="ID друга или Имя..." style="width:100%; padding:10px; background:#0e1621; border:none; border-radius:10px; color:white">
            <button class="btn" style="background:var(--blue); color:white" onclick="action()" id="act-btn">Создать канал</button>
        </div>
        <div class="list" id="r-list"></div>
        <div style="padding:15px; background:#1c2733; display:flex; align-items:center; gap:10px" onclick="showProf()">
            <div class="av" id="m-av" style="background:var(--blue)">?</div>
            <div style="flex:1"><b id="m-n">...</b><div style="font-size:10px" id="m-id">ID...</div></div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <i class="fa fa-arrow-left" style="margin-right:15px" onclick="document.getElementById('app').classList.remove('chat-open')"></i>
            <b id="h-n">Чат</b>
            <button class="btn-icon" id="call-btn" style="margin-left:auto; color:var(--success); display:none" onclick="call()"><i class="fa fa-phone"></i></button>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="file" id="f-in" style="display:none" onchange="upFile()">
            <button class="btn-icon" onclick="document.getElementById('f-in').click()"><i class="fa fa-paperclip"></i></button>
            <input type="text" id="m-in" placeholder="Сообщение..." disabled>
            <button class="btn-icon" id="v-btn" onmousedown="startV()" onmouseup="stopV()" ontouchstart="startV()" ontouchend="stopV()"><i class="fa fa-microphone"></i></button>
            <button class="btn-icon" style="color:var(--blue)" onclick="send()"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div class="modal" id="call-m">
    <div class="m-box">
        <h2 id="c-st">Звонок...</h2>
        <div class="av" style="margin:20px auto; width:70px; height:70px; background:var(--blue); font-size:25px">📞</div>
        <audio id="remote-audio" autoplay></audio>
        <button class="btn" id="ans-b" style="background:var(--success); color:white; display:none">ПРИНЯТЬ</button>
        <button class="btn" style="background:var(--danger); color:white" onclick="location.reload()">СБРОС</button>
    </div>
</div>

<div class="modal" id="prof-m">
    <div class="m-box">
        <h3>Профиль</h3>
        <input type="text" id="ed-n" placeholder="Имя" style="width:100%; padding:10px; margin-bottom:10px; background:#0e1621; border:none; color:white; border-radius:10px">
        <input type="text" id="ed-c" placeholder="Цвет (hex)" style="width:100%; padding:10px; margin-bottom:10px; background:#0e1621; border:none; color:white; border-radius:10px">
        <button class="btn" style="background:var(--blue); color:white" onclick="saveProf()">Сохранить</button>
        <button class="btn" style="background:var(--danger); color:white" onclick="localStorage.clear(); location.reload()">Выйти</button>
        <button class="btn" style="background:none; color:white" onclick="this.parentElement.parentElement.style.display='none'">Назад</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const fb = { databaseURL: "https://maxi-b3761-default-rtdb.firebaseio.com" };
    const app = initializeApp(fb);
    const db = getDatabase(app);

    let user = null, activeId = null, tab = 'ch', pc, stream, vRec, vChunks = [];

    const play = (id) => document.getElementById(id).play().catch(()=>{});
    const stop = (id) => { const a=document.getElementById(id); a.pause(); a.currentTime=0; };

    window.auth = async (m) => {
        const l = document.getElementById('a-l').value.trim(), p = document.getElementById('a-p').value.trim();
        if(!l || !p) return;
        if(m === 'reg') {
            const uid = 'u_'+Math.random().toString(36).substr(2,5);
            await set(ref(db, 'users/'+l), {p, uid, n:l, c:'#0088cc'});
            alert("Ок! Входи.");
        } else {
            const s = await get(ref(db, 'users/'+l));
            if(s.exists() && s.val().p === p) {
                user = {l, ...s.val()};
                localStorage.setItem('cl_s', JSON.stringify({l,p}));
                document.getElementById('auth-screen').style.display='none';
                start();
            } else alert("Ошибка!");
        }
    };

    const s_c = localStorage.getItem('cl_s');
    if(s_c) { const d=JSON.parse(s_c); document.getElementById('a-l').value=d.l; document.getElementById('a-p').value=d.p; auth('login'); }

    function start() {
        document.getElementById('m-n').innerText = user.n;
        document.getElementById('m-av').innerText = user.n[0];
        document.getElementById('m-av').style.background = user.c;
        document.getElementById('m-id').innerText = "ID: "+user.uid;
        onValue(ref(db, `user_chats/${user.l}`), render);
        listen();
    }

    window.setTab = (t, el) => {
        tab = t;
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('act-btn').innerText = t==='ch'?'Создать канал':'Добавить по ID';
        render();
    };

    window.action = async () => {
        const v = document.getElementById('srch').value.trim();
        if(!v) return;
        if(tab === 'ch') {
            const id = 'ch_'+Math.random().toString(36).substr(2,5);
            await set(ref(db, 'rooms/'+id), {n: v, o: user.l});
            await update(ref(db, `user_chats/${user.l}`), {[id]:true});
        } else {
            const s = await get(ref(db, 'users'));
            let f = ''; s.forEach(u => {if(u.val().uid===v) f=u.key;});
            if(f && f!==user.l) {
                const id = [user.l, f].sort().join('___');
                await update(ref(db, `user_chats/${user.l}`), {[id]:true});
                await update(ref(db, `user_chats/${f}`), {[id]:true});
            }
        }
        document.getElementById('srch').value='';
    };

    function render() {
        const b = document.getElementById('r-list'); b.innerHTML = '';
        get(ref(db, `user_chats/${user.l}`)).then(s => {
            Object.keys(s.val()||{}).forEach(id => {
                if(tab==='ch' && id.startsWith('ch_')) {
                    get(ref(db, 'rooms/'+id)).then(r => r.exists() && item(id, r.val().n, '#0088cc'));
                } else if(id.includes('___')) {
                    const f = id.replace(user.l,'').replace('___','');
                    get(ref(db, 'users/'+f)).then(u => item(id, u.val().n, u.val().c));
                }
            });
        });
    }

    function item(id, n, c) {
        const d = document.createElement('div'); d.className = 'item';
        d.innerHTML = `<div class="av" style="background:${c}">${n[0]}</div><b>${n}</b>`;
        d.onclick = () => {
            activeId = id; document.getElementById('h-n').innerText = n;
            document.getElementById('m-in').disabled = false;
            document.getElementById('call-btn').style.display = id.includes('___')?'block':'none';
            document.getElementById('app').classList.add('chat-open');
            loadMsgs();
        };
        document.getElementById('r-list').appendChild(d);
    }

    function loadMsgs() {
        const p = activeId.includes('___') ? `dms/${activeId}` : `msgs/${activeId}`;
        onValue(ref(db, p), s => {
            const b = document.getElementById('messages'); b.innerHTML = '';
            s.forEach(m => {
                const d = m.val();
                if(d.l!==user.l && !d.r) update(ref(db, p+'/'+m.key), {r:true});
                const dv = document.createElement('div'); dv.className = `msg ${d.l===user.l?'sent':''}`;
                let c = d.t;
                if(d.type==='f') c=`<a href="${d.t}" download="${d.name}" style="color:cyan">📁 ${d.name}</a>`;
                if(d.type==='v') c=`<audio src="${d.t}" controls style="width:180px"></audio>`;
                dv.innerHTML = `<b>${d.l}</b>${c}<span class="status ${d.r?'read':''}">${d.l===user.l?(d.r?'✓✓':'✓'):''}</span>`;
                b.appendChild(dv);
            });
            b.scrollTop = b.scrollHeight;
        });
    }

    window.send = (ex={}) => {
        const t = document.getElementById('m-in').value.trim();
        if(!t && !ex.t) return;
        const p = activeId.includes('___') ? `dms/${activeId}` : `msgs/${activeId}`;
        push(ref(db, p), {l: user.l, t: t||ex.t, r:false, ...ex});
        document.getElementById('m-in').value=''; play('snd-msg');
    };

    window.upFile = () => {
        const f = document.getElementById('f-in').files[0];
        const r = new FileReader(); r.onload=()=>send({type:'f', name:f.name, t:r.result});
        r.readAsDataURL(f);
    };

    window.startV = async () => {
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
        vRec = new MediaRecorder(stream); vRec.ondataavailable = e => vChunks.push(e.data);
        vRec.onstop = () => {
            const r = new FileReader(); r.onload=()=>send({type:'v', t:r.result});
            r.readAsDataURL(new Blob(vChunks, {type:'audio/webm'})); vChunks=[];
        };
        vRec.start(); document.getElementById('v-btn').style.color='red';
    };
    window.stopV = () => { if(vRec) vRec.stop(); document.getElementById('v-btn').style.color='var(--gray)'; };

    // --- CALLS ---
    window.call = async () => {
        document.getElementById('call-m').style.display='flex'; play('snd-out');
        pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
        const s = await navigator.mediaDevices.getUserMedia({audio:true});
        s.getTracks().forEach(t => pc.addTrack(t, s));
        pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${activeId}/c`), e.candidate.toJSON());
        pc.ontrack = e => document.getElementById('remote-audio').srcObject = e.streams[0];
        const o = await pc.createOffer(); await pc.setLocalDescription(o);
        await set(ref(db, `calls/${activeId}/o`), {s: o.sdp, t: o.type, f: user.l});
        onValue(ref(db, `calls/${activeId}/a`), async s => {
            if(s.exists()){ stop('snd-out'); await pc.setRemoteDescription(new RTCSessionDescription({sdp:s.val().s, type:s.val().t})); }
        });
    };

    function listen() {
        onValue(ref(db, 'calls'), s => {
            s.forEach(c => {
                const d = c.val();
                if(c.key.includes(user.l) && d.o && d.o.f !== user.l) {
                    play('snd-ring'); document.getElementById('call-m').style.display='flex';
                    document.getElementById('c-st').innerText = "Входящий от " + d.o.f;
                    const ab = document.getElementById('ans-b'); ab.style.display='block';
                    ab.onclick = async () => {
                        stop('snd-ring'); ab.style.display='none';
                        pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
                        const st = await navigator.mediaDevices.getUserMedia({audio:true});
                        st.getTracks().forEach(t => pc.addTrack(t, st));
                        pc.onicecandidate = e => e.candidate && push(ref(db, `calls/${c.key}/c`), e.candidate.toJSON());
                        pc.ontrack = e => document.getElementById('remote-audio').srcObject = e.streams[0];
                        await pc.setRemoteDescription(new RTCSessionDescription({sdp:d.o.s, type:d.o.t}));
                        const a = await pc.createAnswer(); await pc.setLocalDescription(a);
                        await set(ref(db, `calls/${c.key}/a`), {s: a.sdp, t: a.type});
                        onValue(ref(db, `calls/${c.key}/c`), cs => { cs.forEach(cand => pc.addIceCandidate(new RTCIceCandidate(cand.val()))); });
                    };
                }
            });
        });
    }

    window.showProf = () => { document.getElementById('prof-m').style.display='flex'; document.getElementById('ed-n').value=user.n; };
    window.saveProf = async () => {
        const n = document.getElementById('ed-n').value, c = document.getElementById('ed-c').value;
        await update(ref(db, 'users/'+user.l), {n, c}); location.reload();
    };
</script>
</body>
</html>
